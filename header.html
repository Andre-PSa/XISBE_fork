<style>
    @import url('https://fonts.googleapis.com/css?family=Jaapokki+Subtract&display=swap');

    /* Escopamos os estilos para evitar que afetem o resto da página */
    .custom-header {
        font-family: 'Jaapokki Subtract', sans-serif;
        background-image: url('assets/images/Background.png');
        background-size: cover;
        background-position: center;
        padding: 5px 1%;
        position: relative;
        width: 100%;
        min-height: 80px;
        box-sizing: border-box;
        font-size: 20px;
    }

    .header-container {
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
    }

    .nav-content {
        display: none;
        align-items: center;
        gap: 0;
    }

    .logo {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .auth-buttons-desktop {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
    }

    .nav-links, .nav-links-mobile {
        display: flex;
        gap: 20px;
    }

    .nav-links a, .nav-links-mobile a{
        transition: background-color 0.3s ease, transform 0.3s ease;
  
        /* Garante que o elemento tem um aspeto inicial (opcional) */
        background-color: transparent;
        border-radius: 10px;
        padding: 5px 5px;
    }

    .nav-links a:hover, .nav-links-mobile a:hover{
        background-color: rgba(255, 255, 255, 0.2);
        transform: scale(1.1);
    }

    .nav-link-style {
        text-decoration: none; 
        color: white; 
        font-weight: bold;
    }

    .btn-orange {
        background-color: #FF9114; 
        color: white; 
        border: none; 
        padding: 10px 20px; 
        border-radius: 5px; 
        cursor: pointer;
        font-weight: bold;
    }

    .menu-toggle {
        display: none;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 5px;
        background: transparent;
        border: none;
        cursor: pointer;
        z-index: 1001;
        width: 50px;
    }

    .menu-toggle .bar {
        width: 30px;
        height: 3px;
        background-color: white;
        border-radius: 2px;
    }

    .language-toggle {
      position: relative;
      display: flex;
      align-items: center;
      gap: 12px;
      width: fit-content;
      margin-left: auto;
      margin-right: 2%;
      font-family: Arial, sans-serif;
      font-size: 26px;
      font-weight: 400;
      line-height: 1;
      
    }

    .language-option {
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      cursor: pointer;
      color: white;
      opacity: 1;
      transition: color 0.2s ease, opacity 0.2s ease;
    }

    .language-option.active {
      color: #ff9114;
      font-weight: bold;
      opacity: 1;
    }

    .language-option:hover {
      opacity: 0.8;
    }

    .language-separator {
      color: white;
    }


    /* MOBILE */
    .auth-user-name {
        color: white;
        font-weight: bold;
        font-size: 14px;
    }


    @media (max-width: 771px) {
        .custom-header {
            padding: 10px 20px; /* Reduz padding para não esticar no mobile */
        }

        .menu-toggle {
            display: flex;
        }

        .nav-content {
            display: flex;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
            flex-direction: column;
            position: absolute;
            z-index: 10005;
            top: 60%; 
            left: 70%;
            width: 20%;
            min-width: 110px;
            background-image: url('assets/images/Background.png');
            background-size: cover;
            background-position: center;
            border-radius: 5%;
            border: 2px solid rgba(255, 255, 255, 0.6);
            padding: 20px;
            text-align: center;
            box-sizing: border-box; /* Crucial para a largura não passar dos 100% */
        }

        .nav-content.active {
            opacity: 1; 
            pointer-events: auto;
        }

        .nav-links {
            display: none;
        }

        .auth-buttons-desktop {
            display: none;
        }
        
        .auth-buttons-mobile {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-links-mobile {
            flex-direction: column;
            margin-bottom: 20px;
        }
    }

    @media (max-width: 360px) {
        .nav-content {
            left: 55%;
        }
    }
</style>

<header class="custom-header">
    <div class="header-container">
        <div class="logo">
            <a href="index.html"><img src="assets/images/Logo.png" alt="Logo" style="height: 120px; display: block;"></a>
        </div>
    </div>
</header>
