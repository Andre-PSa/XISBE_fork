      align-items: center;

      max-width: 100%;

.atividade-box {

@media (max-width: 768px) {

  .atividades p,

  }

    flex-direction: column;
    align-items: center;
    justify-content: center;

  }

  }
  .countdown {

  }

  }

  </style>
  <body>
    <div id="header-container"></div>
    <div class="countdown-e-banner">
      <div class="sec-countdown">
        <div class="texto-countdown">
          <p class="join-us" data-i18n data-en="See you next year!" data-pt="Até para o ano!" style="color: #055b61">See you next year!</p>
        </div>
      </div>
      <div class="banner-container" style="width: 100%; overflow: hidden;">
        <picture>
          <source media="(max-width: 768px)" srcset="assets/images/Banner_mobile.png" type="image/png">
          <img src="assets/images/Banner_desktop.png"
            alt="SBE Banner"
            style="width: 100%; height: auto; display: block; object-fit: cover;">
    </picture>
  </div>
</div>
    <div id="footer-container"></div>

    <script>
      fetch("header.html")
        .then((response) => response.text())
        .then((data) => {

          const container = document.getElementById("header-container");

          // Limpa o que lá estiver antes
          container.innerHTML = "";
          // Cria um "fragmento" que processa o HTML e EXECUTA os scripts
          const fragment = document.createRange().createContextualFragment(data);

          // Insere o fragmento no container
          container.appendChild(fragment);

          const savedLanguage = localStorage.getItem("siteLanguage") || "en";

          if (typeof applyLanguage === "function") {
            applyLanguage(savedLanguage);
          }
        })


      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-container").innerHTML = data;
        })
        .catch((error) => console.error("Error loading footer:", error));
    </script>
  </body>
</html>
